run:
  name: DP2 DNF - Rubin object_photoz table
  data_release: DP2
  processing_version: null
  algorithm: dnf

paths:
  summary_hats: /data/cl/lsst/dp2/secondary/catalogs/object_photoz
  report_dir: null
  spectroscopic_test_set: /scratch/users/app.photoz/pz-compute-runs/dp2-v3/common/validation/dp2_clean_test_set.parquet

redshift:
  column: dnf_z_best
  minimum: 0.0
  maximum: 6.0
  bins: 120

spectroscopic_plot:
  minimum: 0.0
  maximum: 2.0

describe:
  percentiles: [0.25, 0.50, 0.75]
  include_contains:
    - dnf

report:
  author: Luigi Lucas de Carvalho Silva
  contact: luigi.lcsilva@gmail.com
  timezone: America/Sao_Paulo

selections:
  - name: all
    label: All objects
    description: All catalog rows before any configured science selection.

cluster:
  type: slurm
  minimum_jobs: 4
  maximum_jobs: 16
  cores: 2
  memory: 16GiB
  processes: 1
  queue: cpu_small
  account: hpc-public
  interface: null
  walltime: "01:00:00"
  wait_timeout: 600
  job_extra_directives:
    - --propagate

run:
  name: DP2-v3 FlexZBoost GAaP 1.0 clipped nested HATS
  data_release: DP2
  processing_version: dp2-v3
  algorithm: fzboost

paths:
  summary_hats: /scratch/users/app.photoz/pz-compute-runs/dp2-v3/fzboost/stage3/output/pz-fzboost-gaap1p0-clipped-hats
  report_dir: null

pdf:
  layout: nested
  column: fzboost_ens_interp

expected:
  pdf_bins: 601
  z_min: 0.0
  z_max: 6.0

selections:
  - name: all
    label: All objects
    description: All catalog rows before any configured science selection.
  - name: clean_i_lt_26
    label: "i_gaap1p0Mag_sfd < 26"
    description: Selection based on finite SFD-corrected GAaP i-band magnitude.
    filters:
      - column: i_gaap1p0Mag_sfd
        maximum: 26.0
        finite: true
  - name: galaxies
    label: "Extended sources (galaxy proxy)"
    description: >-
      Reference-band extended sources used as a practical galaxy proxy. This is
      not a truth-level classification and implies no perfect completeness,
      purity, or stellar rejection; null classifications are excluded.
    filters:
      - column: refExtendedness
        minimum: 1.0
        maximum: 2.0
        finite: true
  - name: galaxies_i_lt_26
    label: "Extended sources with i_gaap1p0Mag_sfd < 26"
    description: >-
      Intersection of the configured extended-source proxy and magnitude cut;
      the same classification caveats apply.
    filters:
      - column: refExtendedness
        minimum: 1.0
        maximum: 2.0
        finite: true
      - column: i_gaap1p0Mag_sfd
        maximum: 26.0
        finite: true

metrics:
  # Scalar science metrics scan the complete catalog. Nested-PDF integrity QA
  # uses the first partitions only: reproducible, but not representative science.
  max_pdf_partitions: 4
  pdf_batch_rows: 10000
  pdf_edge_bins: 1
  low_z_threshold: 0.1
  crosscheck_sample_size: 10000
  exact_id_uniqueness: false

plots:
  nz_ymax_quantile: 0.995
  nz_ymax_headroom: 1.10

thresholds:
  max_invalid_pdf_fraction: 0.0
  max_point_outside_fraction: 0.0
  max_nonfinite_point_fraction: 0.0
  summary_pdf_abs_tolerance: 1.0e-5

cluster:
  type: slurm
  minimum_jobs: 1
  maximum_jobs: 8
  cores: 2
  memory: 40GiB
  processes: 1
  queue: cpu_photoz
  account: hpc-photoz
  interface: ib0
  walltime: "01:00:00"
  wait_timeout: 600
  job_extra_directives:
    - --propagate

run:
  name: DP1-v2 FZBoost GAaP 1.0 matched v4
  data_release: DP1
  processing_version: dp1-v2
  algorithm: fzboost

paths:
  summary_hats: /scratch/users/app.photoz/pz-compute-runs/dp1-v2/dp1-stage2-fzboost-gaap1p0-matched-v4/pz-fzboost-gaap1p0-matched-v4-hats/pz_summary
  pdf_dir: /scratch/users/app.photoz/pz-compute-runs/dp1-v2/dp1-stage2-fzboost-gaap1p0-matched-v4/pz-fzboost-gaap1p0-matched-v4-hats.pdf
  xvals_file: xvals.parquet
  pdf_glob: "*-pdf-part*.parquet"
  report_dir: null

expected:
  pdf_bins: 301
  z_min: 0.0
  z_max: 3.0

selections:
  - name: all
    label: All objects
  - name: clean_i_lt_26
    label: "i_gaap1p0Mag_sfd < 26"
    filters:
      - column: i_gaap1p0Mag_sfd
        maximum: 26.0
        finite: true

metrics:
  pdf_batch_rows: 10000
  pdf_edge_bins: 1
  crosscheck_sample_size: 10000
  exact_id_uniqueness: true

thresholds:
  max_invalid_pdf_fraction: 0.0
  max_point_outside_fraction: 0.0
  max_nonfinite_point_fraction: 0.0
  summary_pdf_abs_tolerance: 1.0e-5

cluster:
  type: slurm
  minimum_jobs: 5
  maximum_jobs: 10
  cores: 8
  memory: 16GB
  processes: 1
  queue: cpu
  account: hpc-public
  interface: ib0
  walltime: "01:00:00"
  wait_timeout: 300
  job_extra_directives:
    - --propagate

run:
  name: DP2-v2 FZBoost GAaP 1.0 clipped
  data_release: DP2
  processing_version: dp2-v2
  algorithm: fzboost

paths:
  summary_hats: /scratch/users/app.photoz/pz-compute-runs/dp2-v2/dp2-stage3-build-hats-fzboost-gaap1p0-clipped/output/pz-fzboost-gaap1p0-clipped-hats/pz_summary
  pdf_dir: /scratch/users/app.photoz/pz-compute-runs/dp2-v2/dp2-stage3-build-hats-fzboost-gaap1p0-clipped/output/pz-fzboost-gaap1p0-clipped-hats.pdf
  xvals_file: xvals.parquet
  pdf_glob: "*-pdf-part*.parquet"
  report_dir: null

expected:
  pdf_bins: 601
  z_min: 0.0
  z_max: 6.0

selections:
  - name: all
    label: All objects
  - name: clean_i_lt_26
    label: "i_gaap1p0Mag_sfd < 26"
    filters:
      - column: i_gaap1p0Mag_sfd
        maximum: 26.0
        finite: true

metrics:
  pdf_batch_rows: 10000
  pdf_edge_bins: 1
  low_z_threshold: 0.1
  crosscheck_sample_size: 10000
  # Exact nunique requires a distributed shuffle; fingerprints remain enabled.
  exact_id_uniqueness: false

plots:
  # Robust display only: off-scale peaks are annotated and remain in all metrics.
  nz_ymax_quantile: 0.995
  nz_ymax_headroom: 1.10

thresholds:
  max_invalid_pdf_fraction: 0.0
  max_point_outside_fraction: 0.0
  max_nonfinite_point_fraction: 0.0
  summary_pdf_abs_tolerance: 1.0e-5

cluster:
  type: slurm
  minimum_jobs: 10
  maximum_jobs: 40
  cores: 8
  memory: 24GB
  processes: 1
  queue: cpu
  account: hpc-public
  interface: ib0
  walltime: "02:00:00"
  wait_timeout: 600
  job_extra_directives:
    - --propagate
